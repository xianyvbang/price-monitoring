{% extends "base.html" %}
{% set title = "日志" %}
{% block content %}
<section class="page-head">
  <div>
    <h1>日志</h1>
    <p>显示最近 7 天的全部日志。</p>
  </div>
  <form class="inline-form" method="post" action="/logs/clear" onsubmit="return confirm('确定清空全部日志？');">
    <button class="danger" type="submit">清空日志</button>
  </form>
</section>

<section class="panel">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>时间</th>
          <th>级别</th>
          <th>分类</th>
          <th>内容</th>
        </tr>
      </thead>
      <tbody>
        {% for log in logs %}
        <tr>
          <td data-label="时间">{{ format_time(log.created_at) }}</td>
          <td data-label="级别"><span class="log-level {{ log.level }}">{{ log.level }}</span></td>
          <td data-label="分类">{{ log.category }}</td>
          <td class="log-message" data-label="内容">{{ log.message }}</td>
        </tr>
        {% else %}
        <tr class="empty-row"><td colspan="4" class="empty">暂无日志</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
