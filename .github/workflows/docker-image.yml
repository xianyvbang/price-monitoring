name: Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rebuild image for (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.event.inputs.tag }}
  cancel-in-progress: true

env:
  IMAGE_NAME: price-monitoring

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Collect build metadata
        id: vars
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          TAG_NAME="${INPUT_TAG}"
          VERSION="${TAG_NAME#v}"
          OWNER_LOWER="$(echo "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LOWER}/${IMAGE_NAME}"
          COMMIT="$(git rev-parse HEAD)"
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            echo "tag_name=${TAG_NAME}"
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
            echo "commit=${COMMIT}"
            echo "created=${CREATED}"
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              MAJOR="${VERSION%%.*}"
              MINOR_PATCH="${VERSION#*.}"
              MINOR="${MINOR_PATCH%%.*}"
              echo "${IMAGE}:${MAJOR}.${MINOR}"
              echo "${IMAGE}:${MAJOR}"
            fi
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write VERSION file
        run: echo "${{ steps.vars.outputs.version }}" > VERSION

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.commit }}
            org.opencontainers.image.created=${{ steps.vars.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
