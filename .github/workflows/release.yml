name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: price-monitoring

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Collect release metadata
        id: vars
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG_NAME="${INPUT_TAG}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG_NAME#v}"
          OWNER_LOWER="$(echo "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER_LOWER}/${IMAGE_NAME}"
          COMMIT="$(git rev-parse HEAD)"
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PACKAGE_NAME="price-monitoring-${VERSION}.tar.gz"

          {
            echo "tag_name=${TAG_NAME}"
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
            echo "commit=${COMMIT}"
            echo "created=${CREATED}"
            echo "package_name=${PACKAGE_NAME}"
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              MAJOR="${VERSION%%.*}"
              MINOR_PATCH="${VERSION#*.}"
              MINOR="${MINOR_PATCH%%.*}"
              echo "${IMAGE}:${MAJOR}.${MINOR}"
              echo "${IMAGE}:${MAJOR}"
            fi
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write VERSION file
        run: echo "${{ steps.vars.outputs.version }}" > VERSION

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Build release package
        shell: bash
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          PACKAGE_NAME: ${{ steps.vars.outputs.package_name }}
        run: |
          set -euo pipefail

          PACKAGE_ROOT="dist/package/price-monitoring-${VERSION}"
          PACKAGE_PATH="dist/${PACKAGE_NAME}"

          rm -rf dist
          mkdir -p "${PACKAGE_ROOT}"

          rsync -a \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='*.log' \
            app "${PACKAGE_ROOT}/"

          rsync -a \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='*.log' \
            extension "${PACKAGE_ROOT}/"

          cp Dockerfile "${PACKAGE_ROOT}/"
          cp docker-compose.yml "${PACKAGE_ROOT}/"
          cp docker-entrypoint.sh "${PACKAGE_ROOT}/"
          cp requirements.txt "${PACKAGE_ROOT}/"
          cp VERSION "${PACKAGE_ROOT}/"
          cp README.md "${PACKAGE_ROOT}/"
          cp .env.example "${PACKAGE_ROOT}/"

          tar -czf "${PACKAGE_PATH}" -C "dist/package" "price-monitoring-${VERSION}"
          echo "Built ${PACKAGE_PATH}"

      - name: Generate release notes
        shell: bash
        env:
          TAG_NAME: ${{ steps.vars.outputs.tag_name }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          if [[ "$(git cat-file -t "refs/tags/${TAG_NAME}" 2>/dev/null || true)" == "tag" ]]; then
            git for-each-ref "refs/tags/${TAG_NAME}" --format='%(contents)' > release-notes.md
          else
            : > release-notes.md
          fi

          if [[ ! -s release-notes.md ]]; then
            echo "Release ${TAG_NAME}" > release-notes.md
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.vars.outputs.tag_name }}
          PACKAGE_NAME: ${{ steps.vars.outputs.package_name }}
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_PATH="dist/${PACKAGE_NAME}"

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --notes-file release-notes.md
            gh release upload "${TAG_NAME}" "${PACKAGE_PATH}" --clobber
          else
            gh release create "${TAG_NAME}" "${PACKAGE_PATH}" \
              --title "${TAG_NAME}" \
              --notes-file release-notes.md
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.commit }}
            org.opencontainers.image.created=${{ steps.vars.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sync-version-file:
    needs: [release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync VERSION file to released tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG_NAME="${INPUT_TAG}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG_NAME#v}"
          CURRENT_VERSION="$(tr -d '\r\n' < VERSION 2>/dev/null || true)"

          if [[ "${CURRENT_VERSION}" == "${VERSION}" ]]; then
            echo "VERSION file already matches ${VERSION}"
            exit 0
          fi

          echo "${VERSION}" > VERSION

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: sync VERSION to ${VERSION} [skip ci]"
          git push origin HEAD:${{ github.event.repository.default_branch }}
